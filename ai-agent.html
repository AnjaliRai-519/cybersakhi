 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSakhi AI Safety Agent</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f5f3ff);
    color: #172554;
}

nav {
    background: #4f46e5;
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #4f46e5;
}

.subtitle {
    text-align: center;
    color: #555;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    resize: vertical;
    font-size: 15px;
    margin-top: 15px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3730a3;
}

#result {
    margin-top: 20px;
    padding: 18px;
    background: #f8fafc;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.loading {
    text-align: center;
    color: #4f46e5;
    font-weight: bold;
}
</style>
</head>

<body>

<nav>
    <strong>🛡️ CyberSakhi</strong>
    <a href="dashboard.html">Dashboard</a>
</nav>

<div class="container">

<div class="card">

<h1>🤖 AI Safety Agent</h1>

<p class="subtitle">
CyberSakhi's AI agent analyzes suspicious messages and recommends safer actions.
</p>

<textarea id="message"
placeholder="Paste a suspicious SMS, WhatsApp message, email or job offer here..."></textarea>

<button onclick="runAgent()">
🤖 Ask CyberSakhi Agent
</button>

<div id="result"></div>

</div>

</div>

<script>

const API_KEY = "PASTE_YOUR_NEW_GEMINI_API_KEY_HERE";

async function runAgent() {

    const message = document.getElementById("message").value.trim();
    const result = document.getElementById("result");

    if (!message) {
        result.innerText = "⚠️ Please enter a message first.";
        return;
    }

    result.innerHTML = '<div class="loading">🤖 CyberSakhi Agent is analyzing...</div>';

    const prompt = `
You are CyberSakhi, an AI-powered digital safety agent.

Analyze the following suspicious digital message.

Your job is to:
1. Understand the message.
2. Identify possible scam indicators.
3. Determine the risk level.
4. Identify the possible scam type.
5. Explain why it may be risky.
6. Give practical safety actions.
7. Tell the user what they should NOT do.

Return the answer in this exact format:

Risk Level:
Risk Score:
Possible Scam Type:
Warning Signs:
Explanation:
Recommended Actions:
Do NOT:

Keep the answer clear and beginner-friendly.

Message to analyze:
${message}
`;

    try {

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="
            + API_KEY,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                {
                                    text: prompt
                                }
                            ]
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            console.log(data);
            result.innerText =
                "❌ AI connection failed.\n\n" +
                (data.error?.message || "Please check your API key.");
            return;
        }

        const answer =
            data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!answer) {
            result.innerText = "❌ No response received from AI.";
            return;
        }

        result.innerText = answer;

    } catch (error) {

        console.log(error);

        result.innerText =
            "❌ Something went wrong.\n\nPlease check your internet connection and API key.";
    }
}

</script>

</body>
</html>
