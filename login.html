 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberSakhi Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f0ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 45px;
        }

        h1 {
            color: #7b2cbf;
            margin: 10px 0;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: #7b2cbf;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a189a;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🩷</div>

        <h1>CyberSakhi</h1>

        <p>Your Digital Safety Assistant</p>

        <input
            type="text"
            id="username"
            placeholder="Enter your name">

        <input
            type="email"
            id="email"
            placeholder="Enter your email">

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>


    <script>

        function login() {

            let name = document.getElementById("username").value.trim();
            let email = document.getElementById("email").value.trim();

            let message = document.getElementById("message");


            if (name === "" || email === "") {

                message.style.color = "red";

                message.innerHTML =
                    "⚠️ Please enter your name and email.";

                return;
            }


            if (!email.includes("@")) {

                message.style.color = "red";

                message.innerHTML =
                    "⚠️ Please enter a valid email.";

                return;
            }


            message.style.color = "green";

            message.innerHTML =
                "✅ Login successful!";


            setTimeout(function() {

                window.location.href = "dashboard.html";

            }, 1000);

        }

    </script>

</body>

</html>
