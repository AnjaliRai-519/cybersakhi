 <!DOCTYPE html>
<html>
<head>
    <title>CyberSakhi - Scam Detector</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #172554;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            resize: none;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            line-height: 1.6;
        }

        .high {
            background: #fee2e2;
            color: #991b1b;
        }

        .medium {
            background: #fef3c7;
            color: #92400e;
        }

        .safe {
            background: #dcfce7;
            color: #166534;
        }

        .risk-bar {
            width: 100%;
            height: 15px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 12px;
        }

        .risk-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.8s ease;
        }

        .risk-number {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }

        .warning-title {
            font-weight: bold;
            margin-top: 10px;
        }

        .explanation {
            margin-top: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
        }

        .tip {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
        }

        .back {
            background: #64748b;
        }

        .back:hover {
            background: #475569;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            nav {
                padding: 15px;
            }

            nav h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>🛡️ CyberSakhi</h2>

    <a href="dashboard.html">
        Dashboard
    </a>
</nav>


<div class="container">

    <div class="card">

        <h1>🔍 Scam Detector</h1>

        <p class="subtitle">
            Paste a suspicious message below to check for common scam warning signs.
        </p>


        <textarea
            id="message"
            placeholder="Example: Congratulations! You won a lottery. Pay a small fee to claim your prize...">
        </textarea>


        <button onclick="checkScam()">
            🔎 Check Message
        </button>


        <div id="result"></div>


        <button
            class="back"
            onclick="location.href='dashboard.html'">

            ← Back to Dashboard

        </button>

    </div>

</div>


<script>

function checkScam() {

    let message =
        document.getElementById("message").value
        .toLowerCase()
        .trim();

    let result =
        document.getElementById("result");


    /* Empty message */

    if (message === "") {

        result.style.display = "block";

        result.className = "medium";

        result.innerHTML =
            "⚠️ <b>Please enter a message first.</b>";

        return;
    }


    let score = 0;

    let reasons = [];

    let explanations = [];


    /* Warning keywords */

    let urgency = [
        "urgent",
        "immediately",
        "act now",
        "within 24 hours",
        "last chance"
    ];


    let money = [
        "send money",
        "pay",
        "payment",
        "fee",
        "refund",
        "prize",
        "lottery",
        "investment",
        "guaranteed return"
    ];


    let personal = [
        "otp",
        "password",
        "pin",
        "cvv",
        "bank account",
        "credit card",
        "debit card",
        "kyc"
    ];


    let links = [
        "click this link",
        "click here",
        "verify your account",
        "claim now",
        "download"
    ];


    let job = [
        "registration fee",
        "job fee",
        "pay to get job",
        "work from home"
    ];


    /* Urgency */

    for (let word of urgency) {

        if (message.includes(word)) {

            score += 15;

            reasons.push(
                "⚠️ Urgent or pressure-based language"
            );

            explanations.push(
                "Scammers often create pressure so users do not have enough time to verify the message."
            );

            break;
        }
    }


    /* Money */

    for (let word of money) {

        if (message.includes(word)) {

            score += 20;

            reasons.push(
                "💰 Money or payment request"
            );

            explanations.push(
                "Unexpected payments, fees or prize claims can be warning signs of a scam."
            );

            break;
        }
    }


    /* Personal information */

    for (let word of personal) {

        if (message.includes(word)) {

            score += 25;

            reasons.push(
                "🔐 Request for sensitive information"
            );

            explanations.push(
                "Never share OTP, PIN, CVV, passwords or banking details with unknown people."
            );

            break;
        }
    }


    /* Suspicious links */

    for (let word of links) {

        if (message.includes(word)) {

            score += 15;

            reasons.push(
                "🔗 Suspicious link or action requested"
            );

            explanations.push(
                "Unknown links can lead to phishing websites or malicious downloads."
            );

            break;
        }
    }


    /* Job scam */

    for (let word of job) {

        if (message.includes(word)) {

            score += 20;

            reasons.push(
                "💼 Possible job/internship scam"
            );

            explanations.push(
                "Be cautious if someone asks you to pay money to get a job or internship."
            );

            break;
        }
    }


    /* Website link */

    if (
        message.includes("http://") ||
        message.includes("https://") ||
        message.includes("www.")
    ) {

        score += 10;

        reasons.push(
            "🌐 Contains a web link"
        );

        explanations.push(
            "Verify the website address carefully before entering any personal or financial information."
        );
    }


    /* Maximum score */

    if (score > 100) {
        score = 100;
    }


    /* Risk level */

    let level;

    let className;


    if (score >= 60) {

        level = "🔴 HIGH RISK";

        className = "high";

    }

    else if (score >= 30) {

        level = "🟠 MEDIUM RISK";

        className = "medium";

    }

    else {

        level = "🟢 LOW RISK";

        className = "safe";
    }


    /* Show result */

    result.style.display = "block";

    result.className = className;


    /* Result content */

    let warningHTML = "";


    if (reasons.length > 0) {

        warningHTML =
            "<div class='warning-title'>" +
            "⚠️ Warning Signs:" +
            "</div>" +

            reasons.join("<br>") +

            "<div class='warning-title'>" +
            "💡 Why is this risky?" +
            "</div>";


        for (let i = 0; i < explanations.length; i++) {

            warningHTML +=
                "<div class='explanation'>" +
                explanations[i] +
                "</div>";
        }

    }

    else {

        warningHTML =
            "✅ No major warning patterns were detected.";
    }


    /* Final output */

    result.innerHTML =

        "<div class='risk-number'>" +

        "Risk Score: " +
        score +
        "/100" +

        "</div>" +


        "<div class='risk-bar'>" +

        "<div class='risk-fill' " +

        "style='width:" +
        score +
        "%; background:#2563eb;'>" +

        "</div>" +

        "</div>" +


        "<br>" +


        "<b>" +
        level +
        "</b>" +


        "<br><br>" +


        warningHTML +


        "<div class='tip'>" +

        (
            score >= 60

            ?

            "⚠️ <b>Safety Tip:</b> Do not share OTP, passwords, PINs or banking details. Avoid making payments until the message is verified."

            :

            score >= 30

            ?

            "🔎 <b>Safety Tip:</b> Be cautious. Verify the sender and information through an official source before taking action."

            :

            "🛡️ <b>Safety Tip:</b> Even if a message appears safe, never share sensitive information without verification."
        )

        +

        "</div>";
}

</script>

</body>
</html>
