 <!DOCTYPE html>
<html>
<head>
    <title>CyberSakhi - Scam Detector</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #172554;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            resize: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {.risk-bar {
    width: 100%;
    height: 15px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 12px;
}

.risk-fill {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    transition: width 0.8s ease;
}

.risk-number {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
}
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            display: none;
            line-height: 1.6;
        }

        .high {
            background: #fee2e2;
            color: #991b1b;
        }

        .medium {
            background: #fef3c7;
            color: #92400e;
        }

        .safe {
            background: #dcfce7;
            color: #166534;
        }

        .back {
            background: #64748b;
        }
    </style>
</head>

<body>

<nav>
    <h2>🛡️ CyberSakhi</h2>
    <a href="dashboard.html">Dashboard</a>
</nav>

<div class="container">

    <div class="card">

        <h1>🔍 Scam Detector</h1>

        <p class="subtitle">
            Paste a suspicious message below to check for common scam warning signs.
        </p>

        <textarea id="message"
        placeholder="Example: Congratulations! You won a lottery..."></textarea>

        <button onclick="checkScam()">
            🔎 Check Message
        </button>

        <div id="result"></div>

        <button class="back" onclick="location.href='dashboard.html'">
            ← Back to Dashboard
        </button>

    </div>

</div>
<script>

function checkScam() {

    let message = document.getElementById("message").value.toLowerCase().trim();
    let result = document.getElementById("result");

    if (message === "") {
        result.style.display = "block";
        result.className = "medium";
        result.innerHTML = "⚠️ Please enter a message first.";
        return;
    }

    let score = 0;
    let reasons = [];

    let urgency = [
        "urgent", "immediately", "act now",
        "within 24 hours", "last chance"
    ];

    let money = [
        "send money", "pay", "payment", "fee",
        "refund", "prize", "lottery",
        "investment", "guaranteed return"
    ];

    let personal = [
        "otp", "password", "pin", "cvv",
        "bank account", "credit card",
        "debit card", "kyc"
    ];

    let links = [
        "click this link", "click here",
        "verify your account", "claim now",
        "download"
    ];

    let job = [
        "registration fee", "job fee",
        "pay to get job", "work from home"
    ];


    for (let word of urgency) {
        if (message.includes(word)) {
            score += 15;
            reasons.push("Urgent language");
            break;
        }
    }

    for (let word of money) {
        if (message.includes(word)) {
            score += 20;
            reasons.push("Money/payment request");
            break;
        }
    }

    for (let word of personal) {
        if (message.includes(word)) {
            score += 25;
            reasons.push("Request for sensitive information");
            break;
        }
    }

    for (let word of links) {
        if (message.includes(word)) {
            score += 15;
            reasons.push("Suspicious link/action");
            break;
        }
    }

    for (let word of job) {
        if (message.includes(word)) {
            score += 20;
            reasons.push("Possible job scam");
            break;
        }
    }

    if (
        message.includes("http://") ||
        message.includes("https://") ||
        message.includes("www.")
    ) {
        score += 10;
        reasons.push("Contains a web link");
    }

    if (score > 100) {
        score = 100;
    }


    let level;
    
    if (score >= 60) {
        level = "HIGH RISK";
        result.className = "high";
    }
    else if (score >= 30) {
        level = "MEDIUM RISK";
        result.className = "medium";
    }
    else {
        level = "LOW RISK";
        result.className = "safe";
    }


    result.style.display = "block";

    result.innerHTML =
        "<div class='risk-number'>" +
        "Risk Score: " + score + "/100" +
        "</div>" +

        "<div class='risk-bar'>" +
        "<div class='risk-fill' style='width:" +
        score + "%;'></div>" +
        "</div>" +

        "<br><b>" + level + "</b><br><br>" +

        (reasons.length > 0
        ? "<b>Warning Signs:</b><br>" + reasons.join("<br>")
        : "No major warning patterns were detected.") +

        "<br><br>" +

        (score >= 60
        ? "⚠️ Do not share OTP, passwords or banking details."
        : "🔎 Always verify unexpected messages through official sources.");

}

</script>
  
 
     

</body>
</html>
